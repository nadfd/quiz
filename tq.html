<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz ม.3 — เห็นแก่ลูก</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Noto Sans Thai","Tahoma",sans-serif;
    background:linear-gradient(135deg,#eef2ff,#fdf2f8);
    color:#1f2937; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .app{width:min(850px,100%); background:#fff; border-radius:24px; box-shadow:0 18px 50px #0002; overflow:hidden}
  header{padding:28px 32px; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white}
  h1{margin:0 0 6px;font-size:30px}.subtitle{opacity:.9}
  .bar{height:8px;background:#e5e7eb}.fill{height:100%;width:0;background:#22c55e;transition:.3s}
  main{padding:30px 32px}
  .top{display:flex;justify-content:space-between;gap:12px;margin-bottom:22px;color:#6b7280;font-size:14px}
  .question{font-size:22px;font-weight:700;line-height:1.55;margin-bottom:22px}
  .choices{display:grid;gap:12px}
  button.choice{
    width:100%; text-align:left; padding:16px 18px; border:2px solid #e5e7eb;
    background:#fff;border-radius:14px;font-size:17px;cursor:pointer;transition:.18s;
  }
  button.choice:hover{border-color:#818cf8;background:#f5f3ff}
  button.choice.selected{border-color:#4f46e5;background:#eef2ff}
  button.choice.correct{border-color:#16a34a;background:#dcfce7}
  button.choice.wrong{border-color:#dc2626;background:#fee2e2}
  button.choice:disabled{cursor:default}
  .feedback{min-height:58px;margin-top:18px;padding:14px 16px;border-radius:12px;background:#f3f4f6;line-height:1.5;display:none}
  .feedback.show{display:block}
  .actions{display:flex;justify-content:flex-end;margin-top:20px}
  .primary{border:0;background:#4f46e5;color:#fff;padding:13px 22px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .result{text-align:center;padding:18px 0}
  .score{font-size:58px;font-weight:800;color:#4f46e5;margin:10px 0}
  .rank{font-size:21px;font-weight:700;margin-bottom:8px}
  .summary{color:#6b7280;line-height:1.6}
  .review{margin-top:24px;text-align:left;border-top:1px solid #eee;padding-top:20px}
  .review-item{padding:12px 0;border-bottom:1px solid #eee;line-height:1.5}
  .ok{color:#15803d;font-weight:700}.bad{color:#b91c1c;font-weight:700}
  .restart{margin-top:24px}
  @media(max-width:600px){main{padding:22px}.question{font-size:19px}h1{font-size:25px}button.choice{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🎭 Quiz: เห็นแก่ลูก</h1>
  <div class="subtitle">ภาษาไทย ม.3 • 20 ข้อ</div>
</header>
<div class="bar"><div class="fill" id="fill"></div></div>
<main id="main"></main>
</div>

<script>
const questions = [
{q:"1. ใครเป็นผู้พระราชนิพนธ์บทละครพูดเรื่อง “เห็นแก่ลูก”?", a:["พระบาทสมเด็จพระจุลจอมเกล้าเจ้าอยู่หัว","พระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว","พระบาทสมเด็จพระปกเกล้าเจ้าอยู่หัว","สุนทรภู่"], c:1, e:"ผู้พระราชนิพนธ์คือพระบาทสมเด็จพระมงกุฎเกล้าเจ้าอยู่หัว (รัชกาลที่ 6)"},
{q:"2. พระนามแฝงที่ใช้ในการพระราชนิพนธ์เรื่องนี้คืออะไร?", a:["อัศวพาหุ","พระขรรค์เพชร","ศรีอยุธยา","นายแก้ว"], c:1, e:"ทรงใช้พระนามแฝงว่า “พระขรรค์เพชร”"},
{q:"3. “เห็นแก่ลูก” จัดเป็นวรรณกรรมประเภทใด?", a:["นิทานคำกลอน","บทละครพูด","เสภา","บทเห่เรือ"], c:1, e:"เรื่องนี้เป็นบทละครพูดขนาดสั้น"},
{q:"4. เรื่อง “เห็นแก่ลูก” มีลักษณะการดำเนินเรื่องอย่างไร?", a:["หลายองก์หลายฉาก","องก์เดียว ฉากเดียว","เป็นเรื่องเล่าหลายตอน","เป็นบทกวีไม่มีฉาก"], c:1, e:"เป็นบทละครพูดขนาดสั้น มีองก์เดียวและฉากเดียว"},
{q:"5. ตัวละครใดเป็นบิดาผู้ให้กำเนิดแม่ลออ?", a:["พระยาภักดีนฤนาถ","นายล้ำ","นายทอง","พระยาอภัย"], c:1, e:"นายล้ำเป็นบิดาผู้ให้กำเนิดแม่ลออ"},
{q:"6. ใครเป็นผู้เลี้ยงดูแม่ลออเสมือนลูกของตน?", a:["นายล้ำ","พระยาภักดีนฤนาถ","นายทอง","เสมียน"], c:1, e:"พระยาภักดีนฤนาถเป็นผู้เลี้ยงดูแม่ลออ"},
{q:"7. จุดประสงค์สำคัญของนายล้ำในการกลับมาพบแม่ลออคืออะไร?", a:["ต้องการขอเงิน","ต้องการพบลูกและหวังจะได้ประโยชน์จากความสัมพันธ์","ต้องการสมัครงาน","ต้องการย้ายบ้าน"], c:1, e:"นายล้ำกลับมาเกี่ยวข้องกับแม่ลออ แต่ท้ายที่สุดเกิดการตระหนักถึงผลกระทบต่อลูก"},
{q:"8. ข้อใดสะท้อนความขัดแย้งสำคัญของเรื่องได้ดีที่สุด?", a:["ความขัดแย้งระหว่างคนกับธรรมชาติ","ความขัดแย้งระหว่างความต้องการส่วนตัวกับความรักและอนาคตของลูก","ความขัดแย้งระหว่างสองประเทศ","ความขัดแย้งด้านการค้าขาย"], c:1, e:"แก่นความขัดแย้งอยู่ที่การตัดสินใจของผู้ใหญ่ที่อาจกระทบอนาคตและศักดิ์ศรีของลูก"},
{q:"9. เพราะเหตุใดพระยาภักดีนฤนาถจึงไม่ต้องการให้นายล้ำเปิดเผยเรื่องราวในอดีตต่อแม่ลออ?", a:["กลัวเสียทรัพย์สิน","ต้องการปกป้องความรู้สึกและอนาคตของแม่ลออ","ไม่รู้จักนายล้ำ","ต้องการให้แม่ลออเดินทางไปต่างประเทศ"], c:1, e:"เขาคำนึงถึงความรู้สึกและอนาคตของแม่ลออเป็นสำคัญ"},
{q:"10. ข้อใดเป็นคุณธรรมเด่นที่เรื่องต้องการสื่อ?", a:["ความร่ำรวยสำคัญที่สุด","ความรักและความปรารถนาดีของพ่อแม่ที่มีต่อลูก","การเอาชนะผู้อื่น","การเดินทางท่องเที่ยว"], c:1, e:"ความรัก ความเสียสละ และความปรารถนาดีต่อบุตรเป็นแนวคิดสำคัญ"},
{q:"11. นายล้ำมีลักษณะเด่นอย่างไรในช่วงต้นเรื่อง?", a:["เป็นคนมีอดีตไม่ดีและมุ่งประโยชน์ส่วนตน","เป็นนักเรียนที่ขยัน","เป็นขุนนางผู้มีอำนาจ","เป็นพ่อค้าผู้มั่งคั่ง"], c:0, e:"นายล้ำมีอดีตและพฤติกรรมที่ทำให้เกิดปัญหา ก่อนจะเกิดความสำนึกผิด"},
{q:"12. การเปลี่ยนแปลงของนายล้ำในตอนท้ายสะท้อนสิ่งใด?", a:["การแก้แค้น","การสำนึกผิดและต้องการเริ่มต้นชีวิตใหม่","ความทะเยอทะยาน","ความเกียจคร้าน"], c:1, e:"ตอนท้ายแสดงให้เห็นการสำนึกผิดและการยอมรับโอกาสที่จะตั้งตัวใหม่"},
{q:"13. พระยาภักดีนฤนาถแสดงคุณลักษณะใดเด่นที่สุด?", a:["มีเมตตาและเห็นแก่ประโยชน์ของแม่ลออ","เห็นแก่ตัว","ใจร้อน","ขี้เกียจ"], c:0, e:"พระยาภักดีนฤนาถมีเมตตาและให้ความสำคัญกับอนาคตของแม่ลออ"},
{q:"14. ชื่อเรื่อง “เห็นแก่ลูก” สื่อความหมายสำคัญอย่างไร?", a:["ทำทุกอย่างเพื่อให้ตนเองได้ประโยชน์","ตัดสินใจโดยคำนึงถึงความสุขและอนาคตของลูก","ต้องการให้ลูกมีชื่อเสียง","ต้องการให้ลูกทำงานแทน"], c:1, e:"ชื่อเรื่องเน้นการคำนึงถึงลูกเป็นหลัก แม้ต้องเสียสละความต้องการของตนเอง"},
{q:"15. ข้อใดเป็นข้อคิดที่นำไปใช้ในชีวิตจริงได้เหมาะสมที่สุด?", a:["ความผิดในอดีตไม่สามารถแก้ไขได้","ควรรับผิดชอบต่อการกระทำและคิดถึงผลกระทบต่อผู้อื่น","คนเราควรเอาชนะกันเสมอ","ความจริงทุกเรื่องต้องเปิดเผยทันทีโดยไม่คำนึงถึงใคร"], c:1, e:"เรื่องชี้ให้เห็นความรับผิดชอบ การสำนึกผิด และการคำนึงถึงผู้อื่น"},
{q:"16. ลักษณะภาษาของบทละครพูดเหมาะกับสิ่งใดมากที่สุด?", a:["การสนทนาระหว่างตัวละคร","การบรรยายธรรมชาติอย่างยาวนาน","การแต่งโคลง","การเขียนข่าว"], c:0, e:"บทละครพูดใช้บทสนทนาเป็นส่วนสำคัญในการดำเนินเรื่อง"},
{q:"17. ข้อใดเป็นตัวอย่างคำที่ได้รับอิทธิพลจากภาษาอังกฤษที่ปรากฏในเรื่อง?", a:["ออฟฟิศ","ราชดำเนิน","พฤกษา","บุพการี"], c:0, e:"“ออฟฟิศ” (office) เป็นคำทับศัพท์จากภาษาอังกฤษ"},
{q:"18. เหตุใดเรื่องนี้จึงยังให้ข้อคิดแก่ผู้อ่านในปัจจุบันได้?", a:["เพราะมีฉากต่อสู้มาก","เพราะความรัก ความรับผิดชอบ และความรู้สึกผิดชอบชั่วดียังคงเป็นเรื่องร่วมของมนุษย์","เพราะใช้คำศัพท์โบราณจำนวนมาก","เพราะมีตัวละครจำนวนมาก"], c:1, e:"ประเด็นเรื่องความรักของบุพการี ความรับผิดชอบ และศักดิ์ศรียังร่วมสมัย"},
{q:"19. หากพิจารณาคุณค่าด้านสังคม เรื่องนี้สะท้อนเรื่องใด?", a:["การให้โอกาสผู้ที่สำนึกผิดและการคำนึงถึงครอบครัว","การแข่งขันกีฬา","การค้าระหว่างประเทศ","การทำสงคราม"], c:0, e:"เรื่องสะท้อนการให้โอกาสผู้สำนึกผิดและความสำคัญของครอบครัว"},
{q:"20. หากต้องสรุปแก่นเรื่องในประโยคเดียว ข้อใดเหมาะสมที่สุด?", a:["คนเราควรแสวงหาความร่ำรวยเหนือสิ่งอื่นใด","ความรักและความปรารถนาดีต่อลูกอาจทำให้ผู้ใหญ่ยอมเสียสละและให้อภัย","อดีตเป็นสิ่งสำคัญที่สุดในชีวิต","ทุกคนต้องทำตามความต้องการของตนเอง"], c:1, e:"แก่นเรื่องเน้นความรัก ความเสียสละ การให้อภัย และการคำนึงถึงอนาคตของลูก"}
];

let current=0, score=0, answers=[];
const main=document.getElementById("main"), fill=document.getElementById("fill");

function render(){
  if(current>=questions.length){result();return;}
  const x=questions[current];
  fill.style.width=(current/questions.length*100)+"%";
  main.innerHTML=`
    <div class="top"><span>ข้อ ${current+1} / ${questions.length}</span><span>คะแนน ${score}</span></div>
    <div class="question">${x.q}</div>
    <div class="choices">${x.a.map((v,i)=>`<button class="choice" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join("")}</div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="primary" id="next" disabled onclick="next()">${current===questions.length-1?"ดูผลคะแนน":"ข้อต่อไป →"}</button></div>
  `;
}
function choose(i){
  const x=questions[current], buttons=document.querySelectorAll(".choice");
  buttons.forEach(b=>b.disabled=true);
  buttons[i].classList.add(i===x.c?"correct":"wrong");
  if(i!==x.c) buttons[x.c].classList.add("correct");
  const ok=i===x.c;
  if(ok) score++;
  answers.push({q:x.q,choice:x.a[i],correct:x.a[x.c],ok});
  const f=document.getElementById("feedback");
  f.className="feedback show";
  f.innerHTML=(ok?`<span class="ok">✓ ถูกต้อง!</span> `:`<span class="bad">✗ ยังไม่ถูก</span> `)+x.e;
  document.getElementById("next").disabled=false;
}
function next(){current++;render();}
function result(){
  fill.style.width="100%";
  let pct=Math.round(score/questions.length*100);
  let rank=pct>=90?"ยอดเยี่ยม! 🏆":pct>=75?"ดีมาก! ⭐":pct>=60?"ผ่านเกณฑ์ 👍":"ลองทบทวนอีกครั้ง 📚";
  main.innerHTML=`
    <div class="result">
      <div>ทำแบบทดสอบเสร็จแล้ว</div>
      <div class="score">${score}/${questions.length}</div>
      <div class="rank">${rank}</div>
      <div class="summary">ได้ ${pct}% — ทบทวนเรื่องผู้แต่ง ตัวละคร เหตุการณ์ แก่นเรื่อง และข้อคิด แล้วลองใหม่ได้</div>
      <div class="review">
        <h3>เฉลยแบบย่อ</h3>
        ${answers.map((a,i)=>`<div class="review-item"><b>${i+1}.</b> ${a.ok?'<span class="ok">ถูก</span>':'<span class="bad">ผิด</span>'} — เฉลย: ${a.correct}</div>`).join("")}
      </div>
      <button class="primary restart" onclick="restart()">เริ่มใหม่อีกครั้ง ↻</button>
    </div>`;
}
function restart(){current=0;score=0;answers=[];render();}
render();
</script>
</body>
</html>
